name: INSPECT-AI Phase 3 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ml/phase-3-cctv-vision

jobs:
  phase3:
    name: CCTV YOLO vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest

      - name: Compile Python
        run: python -m compileall services/api services/ai

      - name: Run vision unit tests
        env:
          PYTHONPATH: .
          RTIN_ALLOW_DEMO_CCTV: "1"
        run: pytest -q tests/test_cctv_vision.py

      - name: Run CCTV regression tests
        env:
          PYTHONPATH: .
          RTIN_ALLOW_DEMO_CCTV: "1"
        run: pytest -q tests/test_dosje_features.py

      - name: Run AI regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ai_engine.py tests/test_ai_history.py
