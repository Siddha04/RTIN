name: INSPECT-AI Phase 4 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ml/phase-4-document-intelligence

jobs:
  phase4:
    name: Document intelligence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest

      - name: Compile Python
        run: python -m compileall services/api services/ai

      - name: Run document tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_document_intelligence.py

      - name: Run AI regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ai_engine.py tests/test_ai_history.py tests/test_cctv_vision.py
