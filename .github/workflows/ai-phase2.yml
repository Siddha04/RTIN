name: INSPECT-AI Phase 2 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ml/phase-2-history-integration

jobs:
  phase2:
    name: Database-backed AI history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest httpx

      - name: Compile backend and AI
        run: python -m compileall services/api services/ai

      - name: Run Phase 2 unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ai_history.py

      - name: Run Phase 1 regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ai_engine.py

      - name: Run API regression suite
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_inspect_ai.py
