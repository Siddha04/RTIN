name: INSPECT-AI Public Training Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/ai/**"
      - "scripts/**"
      - "tests/test_public_training.py"
      - ".github/workflows/ai-public-training-gate.yml"

jobs:
  public-training-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest

      - name: Compile training code
        run: python -m compileall services/ai scripts

      - name: Run training gate tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_enriched_training.py tests/test_public_training.py

      - name: Verify no raw datasets are tracked
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(data|datasets|raw|train|test-data)/|\.(csv|xlsx|xls|parquet|jsonl|zip)$'; then
            echo "Raw dataset file detected in the repository."
            exit 1
          fi
