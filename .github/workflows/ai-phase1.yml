name: INSPECT-AI Phase 1 AI Verification

on:
  push:
    branches:
      - main
      - ml/phase-1-risk-engine
  pull_request:
    branches:
      - main

jobs:
  ai-engine:
    name: Phase 1 AI Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest

      - name: Compile AI modules
        run: python -m compileall services/ai

      - name: Run AI unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ai_engine.py

      - name: Run API regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_inspect_ai.py
