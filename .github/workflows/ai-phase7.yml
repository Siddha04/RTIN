name: INSPECT-AI Phase 7 Online Data Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ml/phase-7-online-data-pipeline

jobs:
  online-data:
    name: External public data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest

      - name: Compile online-data pipeline
        run: python -m compileall services/api services/ai scripts

      - name: Run online-data tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_online_data.py tests/test_ai_history.py

      - name: Verify no dataset files are tracked
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(data|datasets|raw|train|test-data)/|\\.(csv|xlsx|xls|parquet|jsonl|zip)$'; then
            echo "Raw dataset file detected in the repository."
            exit 1
          fi
