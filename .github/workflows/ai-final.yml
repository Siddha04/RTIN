name: INSPECT-AI Final ML Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ml/phase-6-mlops

jobs:
  final-ml:
    name: Final ML lifecycle verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt pytest httpx

      - name: Compile complete Python tree
        run: python -m compileall services/api services/ai scripts

      - name: Run all ML unit tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_ai_engine.py
          pytest -q tests/test_ai_history.py
          pytest -q tests/test_cctv_vision.py
          pytest -q tests/test_document_intelligence.py
          pytest -q tests/test_assignment_optimizer.py
          pytest -q tests/test_mlops.py
          pytest -q tests/test_mlops_api.py

      - name: Run API regression suite
        env:
          PYTHONPATH: .
          RTIN_ALLOW_DEMO_CCTV: "1"
        run: pytest -q tests/test_inspect_ai.py tests/test_dosje_features.py
