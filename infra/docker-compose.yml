services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspect_ai
      POSTGRES_USER: inspect
      POSTGRES_PASSWORD: inspect
    ports: ["5432:5432"]
    volumes: ["inspect_pg:/var/lib/postgresql/data"]

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes: ["..:/workspace"]
    command: sh -c "pip install -r services/api/requirements.txt && uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: [postgres]

volumes:
  inspect_pg:
