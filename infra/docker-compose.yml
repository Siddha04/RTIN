services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inspect_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - inspect_pg:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes: ["C:\\Users\\varun\\OneDrive\\Documents\\welldropp project\\RTIN:/workspace"]
    command: sh -c "pip install -r services/api/requirements.txt && uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  inspect_pg:
